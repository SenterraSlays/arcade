<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DEEPCRAWL</title>
<meta name="description" content="A turn-based roguelike. Pick a hero, descend ten floors of a shifting dungeon, level up, gather loot and face the Lich King.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../_kit/kit.css?v=1">
<style>
  :root { --bg: #0b0910; --panel: rgba(22, 18, 30, .96); --panel2: #2d2540; --line: rgba(220, 205, 255, .14); --line2: rgba(220, 205, 255, .32);
    --text: #f1ecfa; --muted: #b3a8c9; --dim: #776d8c; --accent: #ffb347; --accent-ink: #2b1600; --gold: #ffd479; --good: #6fe39a; --bad: #ff6b6b;
    --overlay: rgba(6, 4, 10, .84); --font-head: "Pixelify Sans", system-ui, sans-serif; --font-body: "Nunito", system-ui, sans-serif; --radius: .45em; }
  body { background: #07060b; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: .6em; padding: max(.55em, env(safe-area-inset-top)) .7em .3em; pointer-events: none; z-index: 5; }
  #hud[hidden], #bar[hidden], #log[hidden] { display: none !important; }
  #stats { background: rgba(10, 8, 16, .78); border: 1px solid var(--line); border-radius: .6em; padding: .45em .6em; min-width: 13.5em; pointer-events: auto; }
  .who { display: flex; align-items: center; gap: .5em; margin-bottom: .35em; }
  .who canvas { width: 2.4em; height: 2.4em; image-rendering: auto; }
  .who b { font: 700 1.05em var(--font-head); display: block; } .who span { color: var(--muted); font-size: .85em; font-weight: 800; }
  .hbar { height: .95em; background: #1d1626; border-radius: 1em; position: relative; overflow: hidden; margin-top: .25em; border: 1px solid #000a; }
  .hbar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .2s; border-radius: 1em; }
  .hbar.hp i { background: linear-gradient(#ff7a7a, #c8324a); } .hbar.hp.low i { background: linear-gradient(#ff3a3a, #8a0a1a); animation: lowhp .8s infinite alternate; }
  @keyframes lowhp { to { filter: brightness(1.5); } }
  .hbar.xp { height: .55em; } .hbar.xp i { background: linear-gradient(#ffe27a, #d99a1a); }
  .hbar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: .7em; font-weight: 900; text-shadow: 0 1px 2px #000; }
  #eff { display: flex; gap: .25em; flex-wrap: wrap; margin-top: .3em; min-height: 0; }
  #eff span { font-size: .72em; font-weight: 900; padding: .1em .4em; border-radius: .4em; background: #000a; border: 1px solid var(--line2); }
  #info { display: flex; gap: .45em; align-items: center; pointer-events: auto; }
  #info .chip { background: rgba(10, 8, 16, .78); border: 1px solid var(--line); border-radius: .6em; padding: .35em .6em; font: 700 1em var(--font-head); }
  #depth { color: #c9b8ff; } #goldTxt { color: var(--gold); }
  #log { position: fixed; left: .7em; bottom: calc(5.4em + env(safe-area-inset-bottom)); max-width: min(34em, 70vw); pointer-events: none; z-index: 4; display: flex; flex-direction: column; gap: .15em; }
  #log div { font-weight: 800; font-size: .9em; text-shadow: 0 1px 3px #000, 0 0 6px #000; transition: opacity .6s; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: flex-end; gap: .4em; padding: .4em .5em max(.55em, env(safe-area-inset-bottom)); z-index: 5; pointer-events: none; flex-wrap: wrap; }
  .slot { pointer-events: auto; position: relative; width: 3.6em; height: 3.6em; border-radius: .6em; background: rgba(16, 12, 24, .88); border: 1px solid var(--line2); display: grid; place-items: center; cursor: pointer; color: var(--text); font: inherit; padding: 0; touch-action: manipulation; }
  .slot:hover { border-color: var(--accent); } .slot.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .slot canvas { width: 2.6em; height: 2.6em; }
  .slot .k { position: absolute; left: .25em; top: .1em; font: 700 .7em var(--font-head); color: var(--muted); }
  .slot .n { position: absolute; right: .3em; bottom: .15em; font: 700 .85em var(--font-head); text-shadow: 0 1px 2px #000; }
  .slot .cd { position: absolute; inset: 0; border-radius: .6em; background: rgba(0, 0, 0, .66); display: grid; place-items: center; font: 700 1.2em var(--font-head); color: #fff; }
  .slot.abil { border-color: #8f6bff88; }
  .slot.wide { width: auto; padding: 0 .9em; font: 700 .95em var(--font-head); }
  .slot.go { background: linear-gradient(#ffcf6a, #e08a1a); color: #2b1600; border-color: transparent; animation: gop 1s infinite alternate; }
  @keyframes gop { to { box-shadow: 0 0 1em #ffb347; } }
  .sep { width: .5em; }
  #tip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5.2em + env(safe-area-inset-bottom)); background: #000d; border: 1px solid var(--line2); border-radius: .5em; padding: .4em .7em; font-weight: 800; font-size: .88em; max-width: min(26em, 92vw); text-align: center; pointer-events: none; z-index: 6; }
  #tip:empty { display: none; }
  .logo { font: 700 clamp(2.6em, 11vw, 5.2em)/1 var(--font-head); letter-spacing: .06em; color: #ffcf6a; text-shadow: 0 .06em 0 #6a2a00, 0 0 .4em #ff7a1a88; }
  .logo.sm { font-size: clamp(1.8em, 7vw, 2.8em); }
  .classes { display: flex; gap: .7em; flex-wrap: wrap; justify-content: center; width: min(100%, 50em); }
  .cls { width: 14.5em; display: flex; flex-direction: column; align-items: center; gap: .3em; padding: .8em .7em; text-align: center; }
  .cls canvas { width: 5em; height: 5em; }
  .cls b { font: 700 1.25em var(--font-head); }
  .cls small { color: var(--muted); font-weight: 700; line-height: 1.3; display: block; }
  .cls .st { font: 700 .82em var(--font-head); color: var(--gold); }
  .cls.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .perks { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; width: min(100%, 46em); }
  .perk { width: 13em; display: flex; flex-direction: column; gap: .25em; padding: .9em .8em; text-align: center; }
  .perk b { font: 700 1.15em var(--font-head); color: var(--gold); } .perk small { color: var(--muted); font-weight: 700; }
  .k-btn small { display: block; font-weight: 700; color: var(--muted); font-size: .85em; }
  .k-btn.primary small { color: #6a3a00; }
  @media (max-width: 640px) { #stats { min-width: 0; width: 11.5em; font-size: .9em; } #info .chip { font-size: .85em; padding: .3em .45em; } .slot { width: 3.1em; height: 3.1em; } .slot canvas { width: 2.2em; height: 2.2em; } #log { bottom: calc(8.6em + env(safe-area-inset-bottom)); font-size: .85em; } #tip { bottom: calc(8.6em + env(safe-area-inset-bottom)); } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div id="stats"><div class="who"><canvas id="face" width="96" height="96"></canvas><div><b id="clsName">Warrior</b><span id="lvl">Level 1</span></div></div>
    <div class="hbar hp" id="hpWrap"><i id="hpBar"></i><span id="hpTxt"></span></div>
    <div class="hbar xp"><i id="xpBar"></i><span id="xpTxt"></span></div>
    <div id="eff"></div></div>
  <div id="info"><span class="chip" id="depth">Floor 1</span><span class="chip" id="goldTxt">● 0</span><button class="k-btn small" id="menuBtn" type="button" aria-label="Menu">☰</button></div>
</div>
<div id="log" hidden></div>
<div id="tip"></div>
<div id="bar" hidden></div>
<div id="ui"></div>
<script src="../_kit/kit.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
