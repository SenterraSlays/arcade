<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GAMBIT</title>
<meta name="description" content="Chess against a built-in engine with eight levels, or with a friend on one device. Hints, takebacks, clocks, game review and PGN export.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_kit/kit.css?v=1">
<style>
  :root { --bg: #16130f; --panel: rgba(32, 27, 22, .97); --panel2: #2c251e; --line: rgba(255, 236, 205, .12); --line2: rgba(255, 236, 205, .28);
    --text: #f6efe3; --muted: #b9ad9b; --dim: #857a6b; --accent: #e3b158; --accent-ink: #261a05; --accent2: #7fb3ff; --gold: #f2c86b; --good: #8bd17c; --bad: #ef7b6b;
    --overlay: rgba(14, 11, 8, .8); --font-head: "Playfair Display", Georgia, serif; --font-body: "Inter", system-ui, sans-serif; --radius: .5em; }
  body { background: radial-gradient(ellipse at 50% 30%, #2a2219, #110e0b 75%); }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px; padding-top: max(12px, env(safe-area-inset-top)); }
  #boardCol { display: flex; flex-direction: column; gap: 8px; }
  #board { display: block; border-radius: 6px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 236, 205, .08); touch-action: none; }
  .pcard { display: flex; align-items: center; gap: .6em; min-height: 2.6em; }
  .pcard .av { width: 2.3em; height: 2.3em; border-radius: .45em; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line2); flex: none; }
  .pcard .av canvas { width: 1.9em; height: 1.9em; }
  .pcard .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .nm small { color: var(--muted); font-weight: 500; margin-left: .35em; }
  .pcard .caps { display: flex; align-items: center; min-height: 1.2em; color: var(--muted); font-size: .85em; font-weight: 600; }
  .pcard .caps canvas { width: 1.25em; height: 1.25em; margin-right: -.45em; }
  .pcard .caps b { margin-left: .7em; }
  .pcard .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .clock { font: 700 1.25em "JetBrains Mono", monospace; padding: .25em .55em; border-radius: .35em; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); color: var(--muted); min-width: 4.4em; text-align: center; }
  .clock.on { background: #f3ead8; color: #1c160f; border-color: transparent; }
  .clock.low { background: #c4483b; color: #fff; }
  .think { color: var(--accent); font-size: .8em; font-weight: 600; }
  #side { width: 320px; display: flex; flex-direction: column; gap: 10px; align-self: stretch; max-height: 100%; padding: 4px 0; }
  #status { font-weight: 700; min-height: 1.4em; color: var(--text); }
  #status small { display: block; color: var(--muted); font-weight: 500; }
  #moves { flex: 1; min-height: 6em; overflow-y: auto; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: var(--radius); padding: .4em; display: grid; grid-template-columns: 2.4em 1fr 1fr; align-content: start; gap: 2px 4px; font-variant-numeric: tabular-nums; }
  #moves .n { color: var(--dim); text-align: right; padding: .2em .3em .2em 0; }
  #moves button { font: 600 .95em var(--font-body); color: var(--text); background: transparent; border: 0; border-radius: .3em; text-align: left; padding: .2em .45em; cursor: pointer; }
  #moves button:hover { background: rgba(255, 255, 255, .06); }
  #moves button.cur { background: var(--accent); color: var(--accent-ink); }
  #moves .empty { grid-column: 1 / -1; color: var(--dim); padding: .4em; font-size: .9em; }
  #nav, #ctrl { display: flex; gap: 6px; }
  #nav .k-btn { flex: 1; padding: .45em 0; }
  #ctrl .k-btn { flex: 1; padding: .55em .3em; font-size: .9em; }
  .logo { font: 900 clamp(2.8em, 12vw, 5.4em)/1 var(--font-head); letter-spacing: .04em; color: #f6efe3; display: flex; align-items: center; gap: .15em; }
  .logo canvas { width: 1em; height: 1em; }
  .setup { display: flex; flex-direction: column; gap: .8em; width: min(100%, 30em); }
  .setup .row { display: flex; flex-direction: column; gap: .35em; text-align: left; }
  .setup .row > span { color: var(--muted); font-size: .85em; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35em; }
  .levels .k-btn { display: flex; flex-direction: column; padding: .5em .2em; gap: .1em; }
  .levels .k-btn small { font-weight: 500; font-size: .72em; color: var(--muted); }
  .levels .k-btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .levels .k-btn.on small { color: var(--accent-ink); opacity: .7; }
  .k-seg { width: 100%; } .k-seg .k-btn { flex: 1; }
  .rating { font: 700 1.1em var(--font-body); color: var(--gold); }
  table.st { border-collapse: collapse; width: min(100%, 30em); font-variant-numeric: tabular-nums; }
  table.st td, table.st th { padding: .35em .5em; border-bottom: 1px solid var(--line); text-align: right; }
  table.st td:first-child, table.st th:first-child { text-align: left; }
  table.st th { color: var(--muted); font-weight: 500; font-size: .85em; }
  .themes { display: flex; gap: .4em; }
  .sw { width: 2.6em; height: 2.6em; border-radius: .35em; border: 2px solid transparent; padding: 0; cursor: pointer; }
  .sw.on { border-color: var(--gold); }
  textarea.fen { font: .85em/1.4 "JetBrains Mono", monospace; width: 100%; height: 3.4em; resize: none; color: var(--text); background: rgba(0, 0, 0, .35); border: 1px solid var(--line2); border-radius: var(--radius); padding: .5em; -webkit-user-select: text; user-select: text; }
  @media (max-aspect-ratio: 5/4) {
    #game { flex-direction: column; justify-content: flex-start; gap: 8px; }
    #side { width: 100%; max-width: none; align-self: auto; flex: 1; min-height: 0; }
    #moves { display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; flex: none; min-height: 0; height: 2.6em; align-items: center; gap: 2px; }
    #moves .n { padding: 0 .1em 0 .4em; }
    #moves button { white-space: nowrap; }
    #moves .empty { white-space: nowrap; }
  }
</style>
</head>
<body>
<div id="game" hidden>
  <div id="boardCol">
    <div class="pcard" id="topCard"></div>
    <canvas id="board" aria-label="Chess board"></canvas>
    <div class="pcard" id="botCard"></div>
  </div>
  <div id="side">
    <div id="status"></div>
    <div id="moves"></div>
    <div id="nav"><button class="k-btn" data-nav="first" title="First move (Home)">⏮</button><button class="k-btn" data-nav="prev" title="Back (←)">◀</button><button class="k-btn" data-nav="next" title="Forward (→)">▶</button><button class="k-btn" data-nav="last" title="Live position (End)">⏭</button></div>
    <div id="ctrl"><button class="k-btn" id="undoBtn" title="Take back (Ctrl+Z)">Takeback</button><button class="k-btn" id="hintBtn" title="Hint (H)">Hint</button><button class="k-btn" id="flipBtn" title="Flip board (F)">Flip</button><button class="k-btn" id="menuBtn" title="Menu (Esc)">Menu</button></div>
  </div>
</div>
<div id="ui"></div>
<script src="../_kit/kit.js?v=1"></script>
<script src="chess.js?v=1"></script>
<script src="pieces.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
