<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PRISMBREAK</title>
<meta name="description" content="A neon brick breaker. 24 levels across three worlds, prism bricks that split your ball, bombs, ten power-ups and an endless mode.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Exo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_kit/kit.css?v=1">
<style>
  :root { --bg: #07061a; --panel: rgba(16, 12, 44, .95); --panel2: #221a5c; --line: rgba(170, 160, 255, .18); --line2: rgba(190, 180, 255, .4);
    --text: #f2f0ff; --muted: #aaa4dd; --dim: #6f69a4; --accent: #3ddcff; --accent-ink: #001a22; --accent2: #ff4d9d; --gold: #ffd43b; --good: #51e08a; --bad: #ff4d6d;
    --overlay: rgba(5, 4, 20, .78); --font-head: "Orbitron", system-ui, sans-serif; --font-body: "Exo 2", system-ui, sans-serif; --radius: .45em; }
  #cv { position: fixed; inset: 0; display: block; touch-action: none; cursor: none; }
  body.menu #cv { cursor: default; }
  #pauseBtn { position: fixed; top: max(.5em, env(safe-area-inset-top)); right: .6em; z-index: 10; }
  .logo { font: 900 clamp(2.2em, 9.5vw, 4.8em)/1 var(--font-head); letter-spacing: .06em; background: linear-gradient(90deg, #ff4d6d, #ffd43b 25%, #51e08a 45%, #3ddcff 65%, #b065ff 85%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(61, 220, 255, .35)); }
  .levels { display: grid; grid-template-columns: repeat(8, 1fr); gap: .4em; width: min(100%, 44em); }
  .lv { display: flex; flex-direction: column; align-items: center; padding: .5em .2em; gap: .1em; }
  .lv b { font: 800 1.2em var(--font-head); } .lv small { color: var(--gold); letter-spacing: .1em; font-size: .75em; } .lv[disabled] b { opacity: .4; }
  .world { width: min(100%, 44em); text-align: left; color: var(--muted); font: 700 .8em var(--font-head); letter-spacing: .14em; margin-top: .3em; }
  @media (max-width: 560px) { .levels { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body class="menu">
<canvas id="cv" aria-label="Playfield"></canvas>
<button class="k-btn small" id="pauseBtn" hidden aria-label="Pause">❚❚</button>
<div id="ui"></div>
<script src="../_kit/kit.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
