<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NINEFOLD</title>
<meta name="description" content="Sudoku with puzzles graded by the techniques they need, hints that explain themselves, notes, undo and a daily puzzle.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_kit/kit.css?v=1">
<style>
  :root { --bg: #f4efe6; --paper: #fffdf8; --ink: #1d2433; --ink2: #47506a; --grid: #c9c2b4; --grid2: #2c3445; --sel: #ffe7a3; --peer: #efe7d6; --same: #ffd36b;
    --given: #1d2433; --mine: #2f5bd3; --bad2: #d43c3c; --note: #6a7287;
    --panel: rgba(255, 253, 248, .97); --panel2: #f1ebdf; --line: rgba(29, 36, 51, .14); --line2: rgba(29, 36, 51, .3); --text: #1d2433; --muted: #5d6578; --dim: #8b92a3;
    --accent: #2f5bd3; --accent-ink: #fff; --gold: #b7791f; --good: #2f9e5b; --bad: #d43c3c; --overlay: rgba(244, 239, 230, .82);
    --font-head: "Fraunces", Georgia, serif; --font-body: "Lexend", system-ui, sans-serif; --radius: .6em; color-scheme: light; }
  body.dark { --bg: #121620; --paper: #1a2030; --ink: #e8ecf5; --ink2: #b6bfd3; --grid: #39425a; --grid2: #9aa5bf; --sel: #3d4a73; --peer: #222a3e; --same: #4a5a8f;
    --given: #e8ecf5; --mine: #8fb0ff; --bad2: #ff7b7b; --note: #9aa3b8; --panel: rgba(26, 32, 48, .97); --panel2: #242c42; --line: rgba(255, 255, 255, .12); --line2: rgba(255, 255, 255, .28);
    --text: #e8ecf5; --muted: #a9b2c6; --dim: #79829a; --accent: #6f95ff; --accent-ink: #0b1020; --gold: #f3c564; --overlay: rgba(18, 22, 32, .86); color-scheme: dark; }
  body { background: var(--bg); }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2.2vmin; padding: 1em; padding-top: max(1em, env(safe-area-inset-top)); }
  #app[hidden] { display: none !important; }
  .col { display: flex; flex-direction: column; gap: 1.4vmin; align-items: stretch; }
  #top { display: flex; align-items: center; gap: .6em; justify-content: space-between; font-weight: 500; color: var(--muted); }
  #top b { color: var(--ink); font-weight: 600; }
  #top .k-btn { padding: .35em .6em; }
  #board { --s: min(82vmin, 640px); width: var(--s); height: var(--s); display: grid; grid-template-columns: repeat(9, 1fr); background: var(--grid2); border: 2px solid var(--grid2); border-radius: 6px; gap: 1px; position: relative; overflow: hidden; }
  .c { position: relative; background: var(--paper); border: 0; padding: 0; font: 500 calc(var(--s) / 15) var(--font-body); color: var(--mine); display: grid; place-items: center; cursor: pointer; outline: none; transition: background .12s; }
  .c.b-r { margin-right: 2px; } .c.b-b { margin-bottom: 2px; }
  .c.given { color: var(--given); font-weight: 600; }
  .c.peer { background: var(--peer); }
  .c.same { background: var(--same); }
  .c.sel { background: var(--sel); box-shadow: inset 0 0 0 2px var(--accent); }
  .c.bad { color: var(--bad2); }
  .c.badbg { background: color-mix(in srgb, var(--bad2) 18%, var(--paper)); }
  .c.hint { animation: hintp 1.2s ease-in-out 3; }
  @keyframes hintp { 50% { box-shadow: inset 0 0 0 4px var(--gold); } }
  .c.wave { animation: wave .55s ease-out; }
  @keyframes wave { 40% { background: color-mix(in srgb, var(--accent) 35%, var(--paper)); transform: scale(.94); } }
  .c.pop { animation: pop .22s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: .2; } }
  .notes { position: absolute; inset: 6%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font: 500 calc(var(--s) / 36) var(--font-body); color: var(--note); }
  .notes span { display: grid; place-items: center; }
  .notes span.hl { color: var(--accent); font-weight: 700; }
  #pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: .8vmin; }
  .n { font: 600 calc(min(82vmin, 640px) / 14) var(--font-body); padding: .25em 0 .1em; background: var(--paper); border: 1px solid var(--line2); color: var(--accent); border-radius: .4em; display: flex; flex-direction: column; align-items: center; line-height: 1; cursor: pointer; }
  .n small { font-size: .32em; color: var(--dim); margin-top: .25em; font-weight: 500; }
  .n.done { opacity: .3; }
  .n.selnum { background: var(--accent); color: var(--accent-ink); }
  .n.selnum small { color: var(--accent-ink); }
  #tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: .8vmin; }
  .t { background: var(--paper); border: 1px solid var(--line2); border-radius: .5em; padding: .55em .2em; color: var(--ink2); font: 500 .85em var(--font-body); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .15em; }
  .t i { font-style: normal; font-size: 1.35em; line-height: 1; }
  .t.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--paper)); }
  .t:focus-visible, .n:focus-visible, .c:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  #hintbox { min-height: 2.6em; color: var(--ink2); font-size: .92em; text-align: center; }
  #hintbox b { color: var(--gold); }
  #blur { position: absolute; inset: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: color-mix(in srgb, var(--paper) 40%, transparent); display: grid; place-items: center; font: 600 1.2em var(--font-body); color: var(--ink2); }
  .logo { font: 800 clamp(2.8em, 11vw, 5.2em)/1 var(--font-head); letter-spacing: .02em; color: var(--ink); }
  .logo span { color: var(--accent); }
  .diffs { display: grid; grid-template-columns: repeat(auto-fit, minmax(10em, 1fr)); gap: .5em; width: min(100%, 44em); }
  .diff { display: flex; flex-direction: column; gap: .15em; text-align: left; padding: .75em .9em; background: var(--paper); }
  .diff b { font-size: 1.05em; } .diff span { color: var(--muted); font-size: .85em; font-weight: 400; } .diff em { color: var(--gold); font-style: normal; font-size: .82em; }
  .big { font: 800 clamp(2.4em, 9vw, 3.6em)/1.1 var(--font-head); }
  @media (orientation: portrait), (max-width: 760px) {
    #app { flex-direction: column; gap: 1.2vmin; justify-content: flex-start; padding-top: max(.6em, env(safe-area-inset-top)); }
    #board { --s: min(96vw, 58vh); }
    .n { font-size: calc(min(96vw, 58vh) / 13); }
    .col.side { width: min(96vw, 58vh); }
  }
  @media (orientation: landscape) and (min-width: 761px) { .col.side { width: min(42vw, 420px); } #pad { grid-template-columns: repeat(3, 1fr); } .n { font-size: 2.2em; padding: .35em 0 .25em; } }
</style>
</head>
<body>
<div id="app" hidden>
  <div class="col">
    <div id="top"><span><b id="dname">Easy</b> · <span id="mist">0 mistakes</span></span><span><b id="timer">0:00</b></span><span class="k-row" style="gap:.3em"><button class="k-btn small" id="pauseBtn" aria-label="Pause">❚❚</button><button class="k-btn small" id="menuBtn" aria-label="Menu">☰</button></span></div>
    <div id="board" role="grid" aria-label="Sudoku board"></div>
  </div>
  <div class="col side">
    <div id="hintbox"></div>
    <div id="tools">
      <button class="t" data-t="undo" title="Undo (Ctrl+Z)"><i>↶</i>Undo</button>
      <button class="t" data-t="erase" title="Erase (Backspace)"><i>⌫</i>Erase</button>
      <button class="t" data-t="notes" title="Notes (N)"><i>✎</i>Notes</button>
      <button class="t" data-t="auto" title="Fill all notes (A)"><i>⋯</i>Auto</button>
      <button class="t" data-t="hint" title="Hint (H)"><i>💡</i>Hint</button>
    </div>
    <div id="pad"></div>
  </div>
</div>
<div id="ui"></div>
<script src="../_kit/kit.js?v=1"></script>
<script src="sudoku.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
