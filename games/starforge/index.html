<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STARFORGE</title>
<meta name="description" content="An idle game about forging stardust. Click the forge, build a solar system of generators, catch golden comets and go supernova.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06041a; --panel: rgba(16, 11, 38, .9); --card: rgba(30, 22, 66, .65); --card2: rgba(44, 32, 92, .75); --line: rgba(170, 150, 255, .18); --line2: rgba(190, 170, 255, .35);
    --text: #f3eeff; --muted: #a99ccf; --dim: #74699a; --gold: #ffd27a; --gold2: #ffb347; --cyan: #8ff0ff; --rose: #ff8fc8; --green: #8dffb8; --red: #ff7d8f;
    --head: "Cinzel", Georgia, serif; --body: "Nunito", system-ui, sans-serif; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--body); font-weight: 600;
    font-size: clamp(13px, .7vmin + 8px, 17px); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #sky { position: fixed; left: 0; top: 0; display: block; touch-action: manipulation; cursor: pointer; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line2); border-radius: .6em; padding: .5em .9em; cursor: pointer; transition: background .12s, border-color .12s, transform .06s; touch-action: manipulation; }
  button:hover { background: var(--card2); border-color: rgba(220, 200, 255, .55); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[disabled] { opacity: .45; cursor: default; }
  button.primary { background: linear-gradient(#ffdf9a, #ffae4a); color: #3a1d00; border-color: #fff0c8; font-weight: 800; }
  button.danger { border-color: rgba(255, 125, 143, .6); color: #ffd0d7; }
  button.small { padding: .3em .6em; font-size: .9em; }
  button.on { border-color: var(--gold); color: var(--gold); }
  .gold { color: var(--gold); } .muted { color: var(--muted); } .green { color: var(--green); } .red { color: var(--red); } .cyan { color: var(--cyan); }

  /* ---------- sky HUD ---------- */
  #hud { position: fixed; z-index: 2; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
  #logo { font: 800 1em/1 var(--head); letter-spacing: .45em; margin: .9em 0 .3em .45em; color: rgba(255, 220, 160, .75); }
  #dust { font: 900 clamp(1.9em, 4.6vmin, 3.1em)/1.05 var(--body); color: #fff6e0; text-shadow: 0 0 .5em rgba(255, 190, 90, .55); font-variant-numeric: tabular-nums; text-align: center; }
  #dust small { font-size: .45em; font-weight: 800; color: var(--gold); letter-spacing: .05em; display: block; }
  #persec { color: var(--muted); font-weight: 800; margin-top: .2em; font-variant-numeric: tabular-nums; }
  #persec b { color: var(--text); }
  #buffs { display: flex; gap: .4em; margin-top: .6em; flex-wrap: wrap; justify-content: center; }
  .buff { position: relative; overflow: hidden; padding: .3em .7em; border-radius: 1em; background: rgba(60, 40, 10, .7); border: 1px solid rgba(255, 210, 122, .6); color: var(--gold); font-weight: 800; font-size: .92em; }
  .buff i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--gold); }
  .buff.storm { background: rgba(10, 40, 60, .7); border-color: rgba(143, 240, 255, .6); color: var(--cyan); }
  .buff.storm i { background: var(--cyan); }
  #news { position: fixed; z-index: 2; pointer-events: none; text-align: center; color: var(--muted); font-style: italic; font-weight: 600; padding: 0 1em; transition: opacity .6s; }
  #toasts { position: fixed; z-index: 7; display: flex; flex-direction: column; gap: .4em; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--line2); border-radius: .7em; padding: .55em .9em; box-shadow: 0 0 22px rgba(120, 80, 255, .25); animation: tin .35s ease-out; max-width: 22em; }
  .toast b { display: block; color: var(--gold); font-weight: 800; }
  .toast span { color: var(--muted); font-size: .92em; }
  .toast.big { border-color: rgba(255, 210, 122, .7); box-shadow: 0 0 30px rgba(255, 190, 90, .35); }
  @keyframes tin { from { transform: translateY(.6em); opacity: 0; } }

  /* ---------- panel ---------- */
  #panel { position: fixed; z-index: 3; right: 0; top: 0; bottom: 0; width: clamp(20em, 32vw, 27em); display: flex; flex-direction: column; background: var(--panel);
    border-left: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #tabs { display: flex; gap: .25em; padding: .5em; padding-top: max(.5em, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #tabs button { flex: 1; padding: .45em .3em; font-size: .86em; font-weight: 800; border-radius: .5em; background: transparent; border-color: transparent; color: var(--muted); position: relative; white-space: nowrap; }
  #tabs button.on { background: var(--card2); color: var(--text); border-color: var(--line2); }
  #tabs .badge { position: absolute; top: -.35em; right: -.2em; min-width: 1.4em; padding: 0 .35em; border-radius: 1em; background: var(--gold2); color: #2a1300; font-size: .75em; line-height: 1.4em; }
  #pane { flex: 1; overflow-y: auto; padding: .6em; display: flex; flex-direction: column; gap: .45em; touch-action: pan-y; }
  .bar { display: flex; gap: .35em; align-items: center; flex-wrap: wrap; }
  .bar .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: .55em; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: .3em .6em; font-size: .88em; background: transparent; }
  .seg button.on { background: var(--card2); color: var(--gold); }
  .gen { display: grid; grid-template-columns: 3.2em 1fr auto; align-items: center; gap: .6em; padding: .45em .6em; text-align: left; border-radius: .7em; }
  .gen canvas { width: 3.2em; height: 3.2em; }
  .gen .nm { font-weight: 800; font-size: 1.05em; }
  .gen .co { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  .gen .co.no { color: var(--red); }
  .gen .ea { color: var(--muted); font-size: .85em; }
  .gen .own { font: 900 1.6em/1 var(--body); color: rgba(255, 255, 255, .22); font-variant-numeric: tabular-nums; }
  .gen.can { border-color: rgba(255, 210, 122, .45); }
  .gen.can .own { color: rgba(255, 230, 180, .45); }
  .gen.hidden-gen { opacity: .5; }
  .gen.hidden-gen canvas { filter: brightness(0); }
  .up { display: grid; grid-template-columns: 2.6em 1fr auto; align-items: center; gap: .55em; padding: .45em .6em; text-align: left; border-radius: .7em; }
  .up canvas { width: 2.6em; height: 2.6em; }
  .up .nm { font-weight: 800; }
  .up .ds { color: var(--muted); font-size: .86em; font-weight: 600; }
  .up .co { font-weight: 800; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .up .co.no { color: var(--red); }
  .up.can { border-color: rgba(255, 210, 122, .5); }
  .empty { color: var(--dim); text-align: center; padding: 1.5em .5em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .8em; padding: .8em; }
  .card h3 { margin: 0 0 .35em; font: 800 1.05em/1.2 var(--head); color: var(--gold); letter-spacing: .04em; }
  .card p { margin: .2em 0; color: var(--muted); }
  .big { font: 900 1.6em/1.2 var(--body); color: var(--text); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: .25em .8em; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
  #tree { position: relative; width: 100%; aspect-ratio: 1 / 1.05; border-radius: .8em; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(circle at 50% 50%, rgba(70, 50, 150, .45), rgba(10, 6, 30, .9) 70%); }
  #tree svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; transform: translate(-50%, -50%); width: 2.3em; height: 2.3em; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: .95em;
    background: rgba(20, 14, 50, .9); border: 2px solid rgba(170, 150, 255, .35); color: var(--dim); }
  .node.avail { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 12px rgba(255, 210, 122, .35); }
  .node.lit { background: radial-gradient(circle, #fff6d6, #ffcf6e 55%, #ff9f3a); border-color: #fff3cf; color: #3a1d00; box-shadow: 0 0 18px rgba(255, 210, 122, .8); }
  .node.sel { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.6em, 1fr)); gap: .35em; }
  .badge2 { aspect-ratio: 1; border-radius: .55em; display: grid; place-items: center; background: rgba(20, 14, 50, .8); border: 1px solid var(--line); padding: 0; }
  .badge2.got { background: radial-gradient(circle, rgba(255, 210, 122, .35), rgba(60, 40, 120, .6)); border-color: rgba(255, 210, 122, .55); }
  .badge2 canvas { width: 70%; height: 70%; }
  .tip { position: fixed; z-index: 9; pointer-events: none; max-width: 19em; background: rgba(12, 8, 30, .97); border: 1px solid var(--line2); border-radius: .6em; padding: .55em .7em; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
  .tip b { color: var(--gold); display: block; } .tip span { color: var(--muted); font-size: .92em; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: .8em; padding: .35em 0; border-bottom: 1px solid rgba(170, 150, 255, .1); }
  .opt input[type=range] { width: 9em; accent-color: var(--gold); }
  select { font: inherit; color: var(--text); background: #120c2c; border: 1px solid var(--line2); border-radius: .45em; padding: .3em .4em; }
  textarea { font: .78em/1.4 ui-monospace, monospace; width: 100%; height: 6em; resize: none; color: var(--text); background: #0c0820; border: 1px solid var(--line2); border-radius: .5em; padding: .5em;
    word-break: break-all; -webkit-user-select: text; user-select: text; }
  .msg { min-height: 1.2em; color: var(--gold); font-size: .92em; }
  .msg.err { color: var(--red); }

  /* ---------- modal ---------- */
  #modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(4, 2, 14, .72); backdrop-filter: blur(3px); padding: 1em; animation: fin .25s ease-out; }
  @keyframes fin { from { opacity: 0; } }
  .dialog { width: min(100%, 28em); background: var(--panel); border: 1px solid var(--line2); border-radius: 1em; padding: 1.3em; text-align: center; box-shadow: 0 0 40px rgba(120, 80, 255, .3); display: flex; flex-direction: column; gap: .7em; }
  .dialog h2 { margin: 0; font: 800 1.4em/1.2 var(--head); color: var(--gold); letter-spacing: .05em; }
  .dialog p { margin: 0; color: var(--muted); }
  .dialog .row { display: flex; gap: .5em; justify-content: center; flex-wrap: wrap; }
  #flash { position: fixed; inset: 0; z-index: 9; pointer-events: none; background: #fff; opacity: 0; }

  @media (orientation: portrait), (max-width: 720px) {
    #panel { top: auto; left: 0; width: auto; height: 54%; border-left: 0; border-top: 1px solid var(--line); border-radius: 1em 1em 0 0; padding-bottom: env(safe-area-inset-bottom); }
    #tabs button { font-size: .8em; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-label="The forge. Click to forge stardust."></canvas>
<div id="hud">
  <div id="logo">STARFORGE</div>
  <div id="dust">0<small>STARDUST</small></div>
  <div id="persec"><b>0</b> per second</div>
  <div id="buffs"></div>
</div>
<div id="news"></div>
<div id="toasts" aria-live="polite"></div>
<aside id="panel">
  <nav id="tabs">
    <button data-tab="forges" class="on">Forges</button>
    <button data-tab="upgrades">Upgrades</button>
    <button data-tab="nova">Supernova</button>
    <button data-tab="ach">Feats</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="settings">⚙</button>
  </nav>
  <div id="pane"></div>
</aside>
<div id="modal" hidden></div>
<div id="flash"></div>
<script src="engine.js?v=1"></script>
<script src="data.js?v=1"></script>
<script src="game.js?v=1"></script>
<script src="ui.js?v=1"></script>
</body>
</html>
